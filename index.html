    // Raw PCM(24kHz, 16-bit, Mono) -> WAV Blob URL 변환 (제미나이 고품질 TTS용)
    function pcmBase64ToWavUrl(base64Pcm, sampleRate = 24000) {
      const binaryString = window.atob(base64Pcm);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

      const wavHeader = new ArrayBuffer(44);
      const view = new DataView(wavHeader);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + len, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, len, true);

      const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
      return URL.createObjectURL(blob);
    }

    // 마크다운 깔끔 렌더링 컴포넌트
    function FormattedMessage({ text }) {
      const lines = (text || "").split('\n');
      const renderBold = (str) => {
        const parts = str.split(/(\*\*.*?\*\*)/g);
        return parts.map((part, i) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return <strong key={i} className="font-extrabold text-slate-900">{part.slice(2, -2)}</strong>;
          }
          return part;
        });
      };

      return (
        <div className="space-y-1.5">
          {lines.map((rawLine, idx) => {
            const line = rawLine.trim();
            if (!line) return <div key={idx} className="h-1.5" />;
            if (line.startsWith('### ')) {
              return <h4 key={idx} className="font-extrabold text-base text-[#113264] pt-2">{renderBold(line.replace('### ', ''))}</h4>;
            }
            if (line.startsWith('## ')) {
              return <h3 key={idx} className="font-extrabold text-lg text-[#113264] pt-2.5">{renderBold(line.replace('## ', ''))}</h3>;
            }
            if (line === '---') {
              return <hr key={idx} className="my-2.5 border-slate-200" />;
            }
            if (line.startsWith('* ') || line.startsWith('- ')) {
              return (
                <div key={idx} className="flex items-start gap-2 pl-1 leading-relaxed">
                  <span className="text-blue-600 font-black mt-0.5">•</span>
                  <span className="flex-1">{renderBold(line.slice(2))}</span>
                </div>
              );
            }
            return <p key={idx} className="leading-relaxed">{renderBold(rawLine)}</p>;
          })}
        </div>
      );
    }

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {

        doc: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,

        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,

        chart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        bulb: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />,

        volume: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />,
        stop: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />,
        copy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

      return (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          {icons[name] || icons.home}
        </svg>
      );
    };

    const PangyoLogo = ({ size = "large" }) => {
      const dim = size === "large" ? "w-28 h-28" : "w-9 h-9";
      return (
        <svg className={dim} viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="56" y="10" width="6" height="6" rx="1" fill="#0284c7" />
          <rect x="65" y="16" width="5" height="5" rx="1" fill="#10b981" />
          <rect x="48" y="18" width="4" height="4" rx="1" fill="#38bdf8" />
          <circle cx="43" cy="38" r="7" fill="#0284c7" />
          <path d="M25 46 C35 52, 52 50, 60 40 C53 56, 48 68, 36 80 L28 74 C35 64, 38 56, 25 46 Z" fill="#0ea5e9" />
          <circle cx="75" cy="42" r="7" fill="#10b981" />
          <path d="M60 52 C70 56, 85 52, 94 44 C84 58, 82 72, 74 82 L64 78 C68 68, 68 60, 60 52 Z" fill="#14b8a6" />
          <path d="M22 86 C35 98, 68 102, 96 82 C84 78, 68 82, 56 80 C44 78, 34 74, 22 86 Z" fill="#0369a1" />

      );
    };

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);

      // 안드로이드 키보드 마이크 입력 안내 상태 (권한 요청 없음)
      const [keyboardVoiceGuide, setKeyboardVoiceGuide] = useState(false);

      const [apiKey, setApiKey] = useState(() => localStorage.getItem("PANGYO_GEMINI_KEY") || "");
      const [availableModels, setAvailableModels] = useState(DEFAULT_MODELS);
      const [selectedModel, setSelectedModel] = useState("gemini-3-flash-preview");
      const [selectedVoice, setSelectedVoice] = useState(() => localStorage.getItem("PANGYO_VOICE") || "Aoede");
      const [speakingIdx, setSpeakingIdx] = useState(null);
      const [ttsLoadingIdx, setTtsLoadingIdx] = useState(null);
      const [modelStatus, setModelStatus] = useState("");
      const [attachment, setAttachment] = useState(null);

      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem("PANGYO_USER") || "null"));
      const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem("PANGYO_SESSIONS") || "[]"));
      const [currentSessionId, setCurrentSessionId] = useState(null);

      const [showSettings, setShowSettings] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [activeTab, setActiveTab] = useState("ai");

      const chatEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const mainInputRef = useRef(null);
      const chatInputRef = useRef(null);
      const audioRef = useRef(null);
      const messagesRef = useRef(messages);

      useEffect(() => {
        messagesRef.current = messages;
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      const syncModelsFromGoogle = async (keyToUse) => {
        const cleanKey = (keyToUse || apiKey).trim();
        if (!cleanKey) return null;
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`);
          const data = await res.json();
          if (!data.models) return null;

          const validModels = data.models
            .filter(m => {
              const name = m.name.replace("models/", "");
              const supportsChat = m.supportedGenerationMethods?.includes("generateContent");
              const isGemini = name.startsWith("gemini-");
              const isExcluded =
                name.includes("1.5") ||
                name.includes("1.0") ||
                name.includes("2.0-flash-exp") ||
                name.includes("embedding") ||
                name.includes("tts") ||
                name.includes("image") ||
                name.includes("vision") ||
                name.includes("aqa") ||
                name.includes("audio") ||
                name.includes("robotics") ||
                name.includes("computer-use");
              return supportsChat && isGemini && !isExcluded;
            })
            .map(m => {
              const id = m.name.replace("models/", "");
              return { id, label: m.displayName ? `${m.displayName} (${id})` : id };
            });

          validModels.sort((a, b) => {
            const score = (id) => {
              if (id === "gemini-3-flash-preview") return 100;
              if (id.startsWith("gemini-3")) return 90;
              if (id === "gemini-flash-latest") return 85;
              if (id === "gemini-pro-latest") return 80;
              if (id.startsWith("gemini-2.5")) return 70;
              return 50;
            };
            return score(b.id) - score(a.id);
          });

          if (validModels.length > 0) {
            setAvailableModels(validModels);
            if (!validModels.some(m => m.id === selectedModel)) {
              setSelectedModel(validModels[0].id);
            }
            setModelStatus(`✅ 최신 모델 ${validModels.length}개 동기화 완료`);
            return validModels;
          }
        } catch (e) {
          console.warn(e);
        }
        return null;
      };

      useEffect(() => {
        if (apiKey) syncModelsFromGoogle(apiKey);
      }, [apiKey]);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64Data = reader.result.split(",")[1];
          setAttachment({
            name: file.name,
            mimeType: file.type || "image/png",
            data: base64Data
          });
        };
        reader.readAsDataURL(file);
      };

      // =========================================================================
      // 🎤 안드로이드 키보드 내장 마이크 호출용 포커스 핸들러 (브라우저 권한 요청 0%)
      // =========================================================================
      const handleKeyboardMicFocus = (target) => {
        setKeyboardVoiceGuide(true);
        if (target === "chat" && chatInputRef.current) {
          chatInputRef.current.focus();
          chatInputRef.current.click();
        } else if (mainInputRef.current) {
          mainInputRef.current.focus();
          mainInputRef.current.click();
        }
      };

      const stopAllAudio = () => {
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current = null;
        }
        window.speechSynthesis?.cancel();
        setSpeakingIdx(null);
      };

      // 제미나이 공식 TTS 음성 합성 및 재생
      const speakWithGeminiTTS = async (text, idx) => {
        if (speakingIdx === idx) {
          stopAllAudio();
          return;
        }
        stopAllAudio();

        const cleanText = (text || "").replace(/[*#>`~_-]/g, "").trim();
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          setShowSettings(true);
          return;
        }

        setTtsLoadingIdx(idx);

        try {
          const ttsModels = ["gemini-2.5-flash-preview-tts", "gemini-2.5-pro-preview-tts"];
          let audioBase64 = null;

          for (const ttsModel of ttsModels) {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${ttsModel}:generateContent?key=${cleanKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{
                    parts: [{ text: `다음 내용을 친절하고 자연스러운 한국어 억양으로 읽어주세요:\n\n${cleanText}` }]
                  }],
                  generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                      voiceConfig: {
                        prebuiltVoiceConfig: { voiceName: selectedVoice }
                      }
                    }
                  }
                })
              }
            );
            const data = await res.json();
            const inlineData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
            if (inlineData?.data) {
              audioBase64 = inlineData.data;
              break;
            }
          }

          if (audioBase64) {
            const wavUrl = pcmBase64ToWavUrl(audioBase64, 24000);
            const audio = new Audio(wavUrl);
            audioRef.current = audio;
            setTtsLoadingIdx(null);
            setSpeakingIdx(idx);
            audio.onended = () => {
              setSpeakingIdx(null);
              URL.revokeObjectURL(wavUrl);
            };
            audio.onerror = () => {
              setSpeakingIdx(null);
            };
            await audio.play();
            return;
          }
          throw new Error("TTS 응답 없음");
        } catch (err) {
          setTtsLoadingIdx(null);
          if (window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = "ko-KR";
            setSpeakingIdx(idx);
            utterance.onend = () => setSpeakingIdx(null);
            utterance.onerror = () => setSpeakingIdx(null);
            window.speechSynthesis.speak(utterance);
          }
        }
      };

      const callGeminiWithFallback = async (cleanKey, contentsPayload, preferredModel) => {
        const candidates = [
          preferredModel,
          "gemini-3-flash-preview",
          "gemini-flash-latest",
          "gemini-3.1-pro-preview",
          ...availableModels.map(m => m.id)
        ].filter((v, i, a) => v && a.indexOf(v) === i);

        let lastError = null;
        const sysPrompt = "당신은 성남시 분당구 판교노인종합복지관 및 '판교 IT 활동 지원단'의 공식 AI 도우미입니다. 어르신들과 활동가들이 이해하기 쉽게 친절하고 명확한 한국어로 답변하며, 문서 작성·자료 요약·아이디어 기획을 체계적으로 돕습니다.";

        for (const modelId of candidates) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${cleanKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: contentsPayload,
                  systemInstruction: { parts: [{ text: sysPrompt }] }
                })
              }
            );
            const data = await response.json();
            if (data.error) {
              const errMsg = data.error.message || "";
              if (errMsg.includes("API_KEY_INVALID") || errMsg.includes("API key not valid")) {
                throw new Error("API 키가 올바르지 않습니다. 우측 상단 설정에서 키를 확인해주세요.");
              }
              lastError = new Error(errMsg);
              continue;
            }
            const replyText = data.candidates?.[0]?.content?.parts?.map(p => p.text).join("\n") || "답변을 생성하지 못했습니다.";
            if (modelId !== preferredModel) setSelectedModel(modelId);
            return replyText;
          } catch (networkErr) {
            lastError = networkErr;
            if (networkErr.message.includes("API 키가 올바르지")) throw networkErr;
          }
        }
        throw lastError || new Error("호출 가능한 모델을 찾을 수 없습니다.");
      };

      const handleSend = async (overridePrompt) => {
        const text = (overridePrompt !== undefined ? overridePrompt : input).trim();
        if ((!text && !attachment) || loading) return;

        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          setShowSettings(true);
          return;
        }

        setKeyboardVoiceGuide(false);

        const userMsg = {
          role: "user",
          text: text || `[첨부파일 분석 요청: ${attachment.name}]`,
          attachment: attachment

        const cleanHistory = messagesRef.current.filter(m => !m.isError);
        const nextMessages = [...cleanHistory, userMsg];

        setMessages(nextMessages);
        setInput("");
        setAttachment(null);
        setLoading(true);
        setActiveTab("ai");

        try {
          const contentsPayload = nextMessages.map(m => {
            const parts = [];
            if (m.text) parts.push({ text: m.text });
            if (m.attachment) {
              parts.push({
                inlineData: {
                  mimeType: m.attachment.mimeType,
                  data: m.attachment.data
                }
              });
            }
            return { role: m.role === "user" ? "user" : "model", parts };
          });

          const botReply = await callGeminiWithFallback(cleanKey, contentsPayload, selectedModel);
          const finalMessages = [...nextMessages, { role: "model", text: botReply, isError: false }];
          setMessages(finalMessages);

          const sId = currentSessionId || Date.now().toString();
          setCurrentSessionId(sId);
          const filteredSessions = sessions.filter(s => s.id !== sId);
          const updatedSessions = [
            {
              id: sId,
              title: (text || "첨부파일 분석").slice(0, 22),
              messages: finalMessages,
              date: new Date().toLocaleDateString("ko-KR")
            },
            ...filteredSessions
          ];
          setSessions(updatedSessions);
          localStorage.setItem("PANGYO_SESSIONS", JSON.stringify(updatedSessions));
        } catch (err) {
          setMessages(prev => [...prev, { role: "model", text: `⚠️ 오류 안내: ${err.message}`, isError: true }]);
        } finally {
          setLoading(false);
        }
      };

        setAttachment(null);

        setShowHistory(false);

              <div className="w-full max-w-4xl flex flex-col items-center text-center my-auto px-2">
                <div className="mb-3 drop-shadow-sm">

                  {/* 안드로이드 키보드 마이크 안내 배너 */}
                  {keyboardVoiceGuide && (

                          입력창이 활성화되었습니다! 화면 아래에 올라온 <strong>태블릿 키보드의 마이크 버튼</strong>을 눌러 말씀해 주세요.

                    enterKeyHint="send"
                    placeholder={keyboardVoiceGuide ? "키보드의 마이크(🎙️) 아이콘을 눌러 말씀해 주세요..." : "무엇을 도와드릴까요?"}

                                alert("답변이 복사되었습니다.");
                              }}
                              className="flex items-center gap-1 hover:text-blue-600"
                            >
                              <Icon name="copy" className="w-4 h-4" /> 복사
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}

                  {loading && (
                    <div className="flex justify-start">
                      <div className="bg-slate-100 text-slate-600 rounded-2xl px-6 py-4 text-base font-medium animate-pulse">
                        판교 AI 도우미가 답변을 작성하고 있습니다...
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* 채팅창 하단 키보드 마이크 안내 배너 */}
                {keyboardVoiceGuide && (
                  <div className="px-6 py-2 bg-blue-50 border-t border-blue-100 flex items-center justify-between text-xs font-bold text-blue-800">
                    <span>⌨️🎙️ 아래 올라온 태블릿 키보드의 마이크 아이콘을 눌러 음성으로 입력하세요.</span>
                    <button onClick={() => setKeyboardVoiceGuide(false)} className="text-slate-500">닫기</button>
                  </div>
                )}

                {/* 하단 연속 질문 입력창 */}
                <div className="p-4 bg-white border-t border-slate-100 flex items-center gap-2.5 shrink-0">
                  <input
                    ref={chatInputRef}
                    type="text"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && handleSend()}
                    enterKeyHint="send"
                    placeholder={keyboardVoiceGuide ? "태블릿 키보드의 마이크(🎙️)를 눌러 말씀해 주세요..." : "이어서 질문하기..."}
                    className="flex-1 px-5 py-3.5 rounded-2xl border border-slate-200 text-base outline-none focus:border-blue-500"
                  />
                  <button
                    onClick={() => handleKeyboardMicFocus("chat")}
                    className={`p-3.5 rounded-2xl transition-all ${
                      keyboardVoiceGuide ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                    }`}
                    title="키보드 마이크로 음성 입력"
                  >
                    <Icon name="mic" className="w-5 h-5" />
                  </button>
                  <button
                    onClick={() => handleSend()}
                    disabled={loading || !input.trim()}
                    className="px-6 py-3.5 rounded-2xl bg-blue-600 text-white font-bold text-base hover:bg-blue-700 disabled:opacity-40"
                  >
                    전송
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* API 및 음성 설정 모달 */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-extrabold text-slate-800 text-lg">API 키 및 제미나이 음성 설정</h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">Google AI Studio API Key</label>
                    <input
                      type="password"
                      value={apiKey}
                      onChange={(e) => {
                        setApiKey(e.target.value);
                        localStorage.setItem("PANGYO_GEMINI_KEY", e.target.value.trim());
                      }}
                      placeholder="AIzaSy... 로 시작하는 키 입력"
                      className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">답변 음성 읽기(TTS) 목소리 선택</label>
                    <select
                      value={selectedVoice}
                      onChange={(e) => {
                        setSelectedVoice(e.target.value);
                        localStorage.setItem("PANGYO_VOICE", e.target.value);
                      }}
                      className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 outline-none"
                    >
                      {GEMINI_VOICES.map(v => (
                        <option key={v.id} value={v.id}>{v.label}</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span className="text-xs text-slate-600 font-medium">
                      {modelStatus || "키 입력 후 모델 동기화를 눌러주세요."}
                    </span>
                    <button
                      onClick={() => syncModelsFromGoogle(apiKey)}
                      className="text-xs font-bold text-blue-600 hover:underline flex items-center gap-1"
                    >
                      <Icon name="refresh" className="w-3.5 h-3.5" /> 모델 동기화
                    </button>
                  </div>

                  <button
                    onClick={() => {
                      syncModelsFromGoogle(apiKey);
                      setShowSettings(false);
                    }}
                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm"
                  >
                    저장 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 지난 대화 기록 서랍 */}
          {showHistory && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-white w-80 h-full p-5 shadow-2xl flex flex-col">
                <div className="flex justify-between items-center pb-4 border-b">
                  <h3 className="font-extrabold text-slate-800">지난 대화 세션</h3>
                  <button onClick={() => setShowHistory(false)} className="text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto py-3 space-y-2 custom-scrollbar">
                  {sessions.length === 0 ? (
                    <div className="text-center text-xs text-slate-400 mt-10">저장된 대화가 없습니다.</div>
                  ) : (
                    sessions.map(s => (
                      <div
                        key={s.id}
                        onClick={() => {
                          setCurrentSessionId(s.id);
                          setMessages(s.messages);
                          setActiveTab("ai");
                          setShowHistory(false);
                        }}
                        className="p-3 rounded-xl border border-slate-100 hover:bg-blue-50 cursor-pointer"
                      >
                        <div className="font-bold text-xs text-slate-700 truncate">{s.title}</div>
                        <div className="text-[11px] text-slate-400 mt-1">{s.date}</div>
                      </div>
                    ))
                  )}
                </div>
                <button
                  onClick={() => {
                    localStorage.removeItem("PANGYO_SESSIONS");
                    setSessions([]);
                  }}
                  className="text-xs text-red-500 hover:underline py-2 font-semibold"
                >
                  기록 전체 비우기
                </button>
              </div>
            </div>
          )}

          {/* 활동가 프로필 전환 모달 */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
                <h3 className="font-extrabold text-slate-800 text-lg mb-1">활동가 계정 선택</h3>
                <p className="text-xs text-slate-500 mb-5">태블릿에서 사용할 프로필을 선택하세요.</p>
                <div className="space-y-2">
                  {["판교 IT 지원단 1호", "판교 IT 지원단 2호", "복지관 담당자"].map((name, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        const u = { name };
                        setUser(u);
                        localStorage.setItem("PANGYO_USER", JSON.stringify(u));
                        setShowLoginModal(false);
                      }}
                      className="w-full py-3 px-4 bg-slate-50 hover:bg-blue-50 rounded-xl text-xs font-bold text-slate-700 border border-slate-200 flex items-center justify-between"
                    >
                      <span>{name}</span>
                      <span className="text-blue-600">선택</span>
                    </button>
                  ))}
                </div>
                <button onClick={() => setShowLoginModal(false)} className="mt-4 text-xs text-slate-400 hover:underline">
                  닫기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
