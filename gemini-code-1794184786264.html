    // Raw PCM(24kHz, 16-bit, Mono) -> WAV Blob URL 변환
    function pcmBase64ToWavUrl(base64Pcm, sampleRate = 24000) {
      const binaryString = window.atob(base64Pcm);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

      const wavHeader = new ArrayBuffer(44);
      const view = new DataView(wavHeader);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + len, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, len, true);

      const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
      return URL.createObjectURL(blob);
    }

    function FormattedMessage({ text }) {
      const lines = (text || "").split('\n');
      const renderBold = (str) => {
        const parts = str.split(/(\*\*.*?\*\*)/g);
        return parts.map((part, i) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return <strong key={i} className="font-extrabold text-slate-900">{part.slice(2, -2)}</strong>;
          }
          return part;
        });
      };

      return (
        <div className="space-y-1.5">
          {lines.map((rawLine, idx) => {
            const line = rawLine.trim();
            if (!line) return <div key={idx} className="h-1.5" />;
            if (line.startsWith('### ')) {
              return <h4 key={idx} className="font-extrabold text-base text-[#113264] pt-2">{renderBold(line.replace('### ', ''))}</h4>;
            }
            if (line.startsWith('## ')) {
              return <h3 key={idx} className="font-extrabold text-lg text-[#113264] pt-2.5">{renderBold(line.replace('## ', ''))}</h3>;
            }
            if (line === '---') {
              return <hr key={idx} className="my-2.5 border-slate-200" />;
            }
            if (line.startsWith('* ') || line.startsWith('- ')) {
              return (
                <div key={idx} className="flex items-start gap-2 pl-1 leading-relaxed">
                  <span className="text-blue-600 font-black mt-0.5">•</span>
                  <span className="flex-1">{renderBold(line.slice(2))}</span>
                </div>
              );
            }
            return <p key={idx} className="leading-relaxed">{renderBold(rawLine)}</p>;
          })}
        </div>
      );
    }

    const PangyoLogo = ({ size = "large" }) => {
      const dim = size === "large" ? "w-28 h-28" : "w-9 h-9";
      return (
        <svg className={dim} viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="56" y="10" width="6" height="6" rx="1" fill="#0284c7" />
          <rect x="65" y="16" width="5" height="5" rx="1" fill="#10b981" />
          <rect x="48" y="18" width="4" height="4" rx="1" fill="#38bdf8" />
          <circle cx="43" cy="38" r="7" fill="#0284c7" />
          <path d="M25 46 C35 52, 52 50, 60 40 C53 56, 48 68, 36 80 L28 74 C35 64, 38 56, 25 46 Z" fill="#0ea5e9" />
          <circle cx="75" cy="42" r="7" fill="#10b981" />
          <path d="M60 52 C70 56, 85 52, 94 44 C84 58, 82 72, 74 82 L64 78 C68 68, 68 60, 60 52 Z" fill="#14b8a6" />
          <path d="M22 86 C35 98, 68 102, 96 82 C84 78, 68 82, 56 80 C44 78, 34 74, 22 86 Z" fill="#0369a1" />

    };

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [micLevels, setMicLevels] = useState([25, 45, 70, 45, 25]);
      const [showIframeMicModal, setShowIframeMicModal] = useState(false);

      // 제미나이 라이브 (Gemini Live) 상태
      const [isLiveOpen, setIsLiveOpen] = useState(false);
      const [liveState, setLiveState] = useState("listening"); // 'listening' | 'thinking' | 'speaking'
      const [liveTranscript, setLiveTranscript] = useState("");
      const [liveReply, setLiveReply] = useState("안녕하세요! 판교 IT 활동 지원단 AI 도우미입니다. 편하게 말씀해 주세요.");

      const [apiKey, setApiKey] = useState(() => window.injectedApiKey || localStorage.getItem("PANGYO_GEMINI_KEY") || "");
      const [availableModels, setAvailableModels] = useState(DEFAULT_MODELS);
      const [selectedModel, setSelectedModel] = useState("gemini-3-flash-preview");
      const [selectedVoice, setSelectedVoice] = useState(() => window.injectedVoice || localStorage.getItem("PANGYO_VOICE") || "Aoede");
      const [speakingIdx, setSpeakingIdx] = useState(null);
      const [ttsLoadingIdx, setTtsLoadingIdx] = useState(null);
      const [modelStatus, setModelStatus] = useState("");
      const [attachment, setAttachment] = useState(null);

      const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem("PANGYO_SESSIONS") || "[]"));
      const [currentSessionId, setCurrentSessionId] = useState(null);

      const [showSettings, setShowSettings] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [activeTab, setActiveTab] = useState("ai");

      const chatEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const audioRef = useRef(null);
      const recognitionRef = useRef(null);
      const waveIntervalRef = useRef(null);
      const silenceTimerRef = useRef(null);
      const isLiveActiveRef = useRef(false);
      const messagesRef = useRef(messages);

      useEffect(() => {
        messagesRef.current = messages;
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      useEffect(() => {
        if (window.injectedApiKey) {
          localStorage.setItem("PANGYO_GEMINI_KEY", window.injectedApiKey);
        }
      }, []);

      // 음성 인식 중 시각적 파형 애니메이션 (getUserMedia와의 마이크 이중 점유 충돌 방지)
      const startWaveAnimation = () => {
        if (waveIntervalRef.current) clearInterval(waveIntervalRef.current);
        waveIntervalRef.current = setInterval(() => {
          setMicLevels([
            Math.floor(25 + Math.random() * 65),
            Math.floor(35 + Math.random() * 65),
            Math.floor(45 + Math.random() * 55),
            Math.floor(35 + Math.random() * 65),
            Math.floor(25 + Math.random() * 65)
          ]);
        }, 120);
      };

      const stopWaveAnimation = () => {
        if (waveIntervalRef.current) {
          clearInterval(waveIntervalRef.current);
          waveIntervalRef.current = null;
        }
        setMicLevels([25, 40, 60, 40, 25]);
      };

      // 구글 사이트 iframe 탈출용 안전한 독립 HTML 생성기 (코드 깨짐 0%)
      const buildStandaloneHtml = () => {
        const babelCode = document.getElementById("app-babel-source")?.textContent || "";
        return `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>판교 IT 활동 지원단 AI 도우미</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
  <script>
    window.injectedApiKey = ${JSON.stringify(apiKey)};
    window.injectedVoice = ${JSON.stringify(selectedVoice)};
  <\/script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Pretendard', sans-serif; background-color: #eaf4fd; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes livePulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.16); opacity: 1; } }
    @keyframes liveRipple { 0% { transform: scale(0.85); opacity: 0.75; } 100% { transform: scale(2.2); opacity: 0; } }
    .live-orb { animation: livePulse 2s infinite ease-in-out; }
    .live-ring-1 { animation: liveRipple 2.2s infinite ease-out; }
    .live-ring-2 { animation: liveRipple 2.2s infinite ease-out 0.7s; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="app-babel-source" type="text/babel">${babelCode}<\/script>
</body>
</html>`;
      };

      // 단독 실행 파일 다운로드 (태블릿이나 PC에서 바로 열거나 호스팅에 올릴 수 있는 파일)
      const downloadStandaloneApp = () => {
        const htmlContent = buildStandaloneHtml();
        const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "판교_AI_도우미_독립실행앱.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const syncModelsFromGoogle = async (keyToUse) => {
        const cleanKey = (keyToUse || apiKey).trim();
        if (!cleanKey) return null;
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`);
          const data = await res.json();
          if (!data.models) return null;

          const validModels = data.models
            .filter(m => {
              const name = m.name.replace("models/", "");
              const supportsChat = m.supportedGenerationMethods?.includes("generateContent");
              const isGemini = name.startsWith("gemini-");
              const isExcluded =
                name.includes("1.5") ||
                name.includes("1.0") ||
                name.includes("2.0-flash-exp") ||
                name.includes("embedding") ||
                name.includes("tts") ||
                name.includes("image") ||
                name.includes("vision") ||
                name.includes("aqa") ||
                name.includes("audio") ||
                name.includes("robotics") ||
                name.includes("computer-use");
              return supportsChat && isGemini && !isExcluded;
            })
            .map(m => {
              const id = m.name.replace("models/", "");
              return { id, label: m.displayName ? `${m.displayName} (${id})` : id };
            });

          validModels.sort((a, b) => {
            const score = (id) => {
              if (id === "gemini-3-flash-preview") return 100;
              if (id.startsWith("gemini-3")) return 90;
              if (id === "gemini-flash-latest") return 85;
              if (id === "gemini-pro-latest") return 80;
              if (id.startsWith("gemini-2.5")) return 70;
              return 50;
            };
            return score(b.id) - score(a.id);
          });

          if (validModels.length > 0) {
            setAvailableModels(validModels);
            if (!validModels.some(m => m.id === selectedModel)) {
              setSelectedModel(validModels[0].id);
            }
            setModelStatus(`✅ 최신 모델 ${validModels.length}개 동기화 완료`);
            return validModels;
          }
        } catch (e) {
          console.warn(e);
        }
        return null;
      };

      useEffect(() => {
        if (apiKey) syncModelsFromGoogle(apiKey);
      }, [apiKey]);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64Data = reader.result.split(",")[1];
          setAttachment({
            name: file.name,
            mimeType: file.type || "image/png",
            data: base64Data
          });
        };
        reader.readAsDataURL(file);
      };

      const stopAllAudio = () => {
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current = null;
        }
        window.speechSynthesis?.cancel();
        setSpeakingIdx(null);
      };

      // 제미나이 공식 TTS 음성 합성 및 재생
      const speakWithGeminiTTS = async (text, idx = -1, onComplete = null) => {
        if (idx !== -1 && speakingIdx === idx) {
          stopAllAudio();
          return;
        }
        stopAllAudio();

        const cleanText = (text || "").replace(/[*#>`~_-]/g, "").trim();
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          setShowSettings(true);
          if (onComplete) onComplete();
          return;
        }

        const ttsInputText = idx === -99 && cleanText.length > 350 ? cleanText.slice(0, 350) : cleanText;
        if (idx >= 0) setTtsLoadingIdx(idx);

        try {
          const ttsModels = ["gemini-2.5-flash-preview-tts", "gemini-2.5-pro-preview-tts"];
          let audioBase64 = null;

          for (const ttsModel of ttsModels) {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${ttsModel}:generateContent?key=${cleanKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{
                    parts: [{ text: `다음 내용을 친절하고 자연스러운 한국어 억양으로 읽어주세요:\n\n${ttsInputText}` }]
                  }],
                  generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                      voiceConfig: {
                        prebuiltVoiceConfig: { voiceName: selectedVoice }
                      }
                    }
                  }
                })
              }
            );
            const data = await res.json();
            const inlineData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
            if (inlineData?.data) {
              audioBase64 = inlineData.data;
              break;
            }
          }

          if (audioBase64) {
            const wavUrl = pcmBase64ToWavUrl(audioBase64, 24000);
            const audio = new Audio(wavUrl);
            audioRef.current = audio;
            setTtsLoadingIdx(null);
            setSpeakingIdx(idx);
            audio.onended = () => {
              setSpeakingIdx(null);
              URL.revokeObjectURL(wavUrl);
              if (onComplete) onComplete();
            };
            audio.onerror = () => {
              setSpeakingIdx(null);
              if (onComplete) onComplete();
            };
            await audio.play();
            return;
          }
          throw new Error("TTS 응답 없음");
        } catch (err) {
          setTtsLoadingIdx(null);
          if (window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance(ttsInputText);
            utterance.lang = "ko-KR";
            setSpeakingIdx(idx);
            utterance.onend = () => {
              setSpeakingIdx(null);
              if (onComplete) onComplete();
            };
            utterance.onerror = () => {
              setSpeakingIdx(null);
              if (onComplete) onComplete();
            };
            window.speechSynthesis.speak(utterance);
          } else if (onComplete) {
            onComplete();
          }
        }
      };

      const callGeminiWithFallback = async (cleanKey, contentsPayload, preferredModel, isLiveMode = false) => {
        const candidates = [
          preferredModel,
          "gemini-3-flash-preview",
          "gemini-flash-latest",
          "gemini-3.1-pro-preview",
          ...availableModels.map(m => m.id)
        ].filter((v, i, a) => v && a.indexOf(v) === i);

        let lastError = null;
        const sysPrompt = isLiveMode
          ? "당신은 성남시 '판교 IT 활동 지원단'의 음성 대화형 AI 도우미입니다. 지금 어르신 또는 활동가와 실시간 음성 대화(Gemini Live) 중입니다. 귀로 듣기 편하도록 마크다운 기호 없이 2~3문장 이내의 친절하고 자연스러운 구어체로 핵심만 대답해주세요."
          : "당신은 성남시 분당구 판교노인종합복지관 및 '판교 IT 활동 지원단'의 공식 AI 도우미입니다. 어르신들과 활동가들이 이해하기 쉽게 친절하고 명확한 한국어로 답변하며, 문서 작성·자료 요약·아이디어 기획을 체계적으로 돕습니다.";

        for (const modelId of candidates) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${cleanKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: contentsPayload,
                  systemInstruction: { parts: [{ text: sysPrompt }] }
                })
              }
            );
            const data = await response.json();
            if (data.error) {
              const errMsg = data.error.message || "";
              if (errMsg.includes("API_KEY_INVALID") || errMsg.includes("API key not valid")) {
                throw new Error("API 키가 올바르지 않습니다. 우측 상단 설정에서 키를 확인해주세요.");
              }
              lastError = new Error(errMsg);
              continue;
            }
            const replyText = data.candidates?.[0]?.content?.parts?.map(p => p.text).join("\n") || "답변을 생성하지 못했습니다.";
            if (modelId !== preferredModel) setSelectedModel(modelId);
            return replyText;
          } catch (networkErr) {
            lastError = networkErr;
            if (networkErr.message.includes("API 키가 올바르지")) throw networkErr;
          }
        }
        throw lastError || new Error("호출 가능한 모델을 찾을 수 없습니다.");
      };

      const handleSend = async (overridePrompt, autoSpeak = false) => {
        const text = (overridePrompt !== undefined ? overridePrompt : input).trim();
        if ((!text && !attachment) || loading) return;

        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          setShowSettings(true);
          return;
        }

        setIsListening(false);
        stopWaveAnimation();

        const userMsg = {
          role: "user",
          text: text || `[첨부파일 분석 요청: ${attachment.name}]`,
          attachment: attachment
        };

        const cleanHistory = messagesRef.current.filter(m => !m.isError);
        const nextMessages = [...cleanHistory, userMsg];

        setMessages(nextMessages);
        setInput("");
        setAttachment(null);
        setLoading(true);
        setActiveTab("ai");

        try {
          const contentsPayload = nextMessages.map(m => {
            const parts = [];
            if (m.text) parts.push({ text: m.text });
            if (m.attachment) {
              parts.push({
                inlineData: {
                  mimeType: m.attachment.mimeType,
                  data: m.attachment.data
                }
              });
            }
            return { role: m.role === "user" ? "user" : "model", parts };
          });

          const botReply = await callGeminiWithFallback(cleanKey, contentsPayload, selectedModel, false);
          const finalMessages = [...nextMessages, { role: "model", text: botReply, isError: false }];
          setMessages(finalMessages);

          if (autoSpeak) {
            speakWithGeminiTTS(botReply, finalMessages.length - 1);
          }

          const sId = currentSessionId || Date.now().toString();
          setCurrentSessionId(sId);
          const filteredSessions = sessions.filter(s => s.id !== sId);
          const updatedSessions = [
            {
              id: sId,
              title: (text || "음성 대화").slice(0, 22),
              messages: finalMessages,
              date: new Date().toLocaleDateString("ko-KR")
            },
            ...filteredSessions
          ];
          setSessions(updatedSessions);
          localStorage.setItem("PANGYO_SESSIONS", JSON.stringify(updatedSessions));
        } catch (err) {
          setMessages(prev => [...prev, { role: "model", text: `⚠️ 오류 안내: ${err.message}`, isError: true }]);
        } finally {
          setLoading(false);
        }
      };

      // =========================================================================
      // 🎤 마이크 버튼 구동 (이중 점유 충돌 제거 & 구글 사이트 iframe 차단 안내)
      // =========================================================================
      const handleMicButtonClick = () => {
        if (isListening) {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (e) {}
          }
          setIsListening(false);
          stopWaveAnimation();
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("현재 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해주세요.");
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = "ko-KR";
          recognition.interimResults = true;
          recognition.continuous = false;

          let finalCaptured = "";

          recognition.onstart = () => {
            setIsListening(true);
            startWaveAnimation();
          };

          recognition.onresult = (event) => {
            const transcript = Array.from(event.results).map(r => r[0].transcript).join("");
            finalCaptured = transcript;
            setInput(transcript);
          };

          recognition.onerror = (event) => {
            setIsListening(false);
            stopWaveAnimation();
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
              // 구글 사이트 iframe 내부여서 마이크가 차단된 경우 전용 안내 모달 표시
              if (window.self !== window.top) {
                setShowIframeMicModal(true);
              } else {
                alert("브라우저 주소창 왼쪽의 설정(자물쇠) 아이콘을 눌러 마이크 권한을 [허용]으로 변경해주세요.");
              }
            }
          };

          recognition.onend = () => {
            setIsListening(false);
            stopWaveAnimation();
            if (finalCaptured.trim()) {
              handleSend(finalCaptured.trim(), true);
            }
          };

          recognition.start();
        } catch (err) {
          setIsListening(false);
          stopWaveAnimation();
          if (window.self !== window.top) {
            setShowIframeMicModal(true);
          }
        }
      };

      // =========================================================================
      // 🌟 제미나이 라이브 (Gemini Live) 연속 핸즈프리 음성 대화
      // =========================================================================
      const handleStartLiveClick = () => {
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          setShowSettings(true);
          return;
        }
        stopAllAudio();
        setIsLiveOpen(true);
        isLiveActiveRef.current = true;
        setLiveState("listening");
        setLiveTranscript("");
        setLiveReply("안녕하세요! 판교 IT 활동 지원단 제미나이 라이브입니다. 지금 편하게 말씀해 주세요.");
        beginLiveListenCycle();
      };

      const stopGeminiLive = () => {
        isLiveActiveRef.current = false;
        setIsLiveOpen(false);
        setLiveState("listening");
        if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
        if (recognitionRef.current) {
          try { recognitionRef.current.abort(); } catch (e) {}
        }
        stopWaveAnimation();
        stopAllAudio();
      };

      const beginLiveListenCycle = () => {
        if (!isLiveActiveRef.current) return;
        setLiveState("listening");
        setLiveTranscript("");
        startWaveAnimation();

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        if (recognitionRef.current) {
          try { recognitionRef.current.abort(); } catch (e) {}
        }

        try {
          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = "ko-KR";
          recognition.interimResults = true;
          recognition.continuous = true;

          let accumulatedText = "";
          let submitted = false;

          const submitTurn = (finalText) => {
            if (submitted || !isLiveActiveRef.current || !finalText.trim()) return;
            submitted = true;
            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            try { recognition.stop(); } catch (e) {}
            processLiveTurn(finalText.trim());
          };

          recognition.onresult = (event) => {
            if (!isLiveActiveRef.current) return;
            const text = Array.from(event.results).map(r => r[0].transcript).join("").trim();
            accumulatedText = text;
            setLiveTranscript(text);

            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            if (text.length > 0) {
              silenceTimerRef.current = setTimeout(() => {
                submitTurn(text);
              }, 1400);
            }
          };

          recognition.onerror = (event) => {
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
              stopGeminiLive();
              if (window.self !== window.top) {
                setShowIframeMicModal(true);
              } else {
                alert("브라우저 주소창 왼쪽 아이콘에서 마이크 권한을 허용해주세요.");
              }
            }
          };

          recognition.onend = () => {
            if (!isLiveActiveRef.current) return;
            if (!submitted && accumulatedText.trim().length > 0) {
              submitTurn(accumulatedText.trim());
            } else if (!submitted) {
              setTimeout(() => {
                if (isLiveActiveRef.current && liveState === "listening") beginLiveListenCycle();
              }, 350);
            }
          };

          recognition.start();
        } catch (e) {}
      };

      const processLiveTurn = async (userVoiceText) => {
        if (!isLiveActiveRef.current || !userVoiceText.trim()) return;
        if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
        if (recognitionRef.current) {
          try { recognitionRef.current.abort(); } catch (e) {}
        }
        stopWaveAnimation();

        setLiveState("thinking");
        setLiveTranscript(userVoiceText);

        const cleanHistory = messagesRef.current.filter(m => !m.isError);
        const nextMessages = [...cleanHistory, { role: "user", text: userVoiceText }];
        setMessages(nextMessages);

        try {
          const contentsPayload = nextMessages.slice(-8).map(m => ({
            role: m.role === "user" ? "user" : "model",
            parts: [{ text: m.text }]
          }));

          const reply = await callGeminiWithFallback(apiKey.trim(), contentsPayload, selectedModel, true);
          if (!isLiveActiveRef.current) return;

          setLiveReply(reply);
          const updatedMessages = [...nextMessages, { role: "model", text: reply, isError: false }];
          setMessages(updatedMessages);

          setLiveState("speaking");
          startWaveAnimation();
          await speakWithGeminiTTS(reply, -99, () => {
            stopWaveAnimation();
            if (isLiveActiveRef.current) {
              beginLiveListenCycle();
            }
          });
        } catch (err) {
          setLiveReply("죄송합니다. 다시 한 번 말씀해 주세요.");
          setTimeout(() => {
            if (isLiveActiveRef.current) beginLiveListenCycle();
          }, 1800);
        }
      };

      const startNewChat = () => {
        setMessages([]);
        setCurrentSessionId(null);
        setAttachment(null);
        setActiveTab("ai");
        setShowHistory(false);
      };

      return (
        <div className="w-screen h-screen flex flex-col justify-between relative overflow-hidden bg-gradient-to-b from-[#d8ecfa] via-[#eef6fc] to-[#d5ebfb]">
          {/* 배경 아트워크 */}
          <div className="pointer-events-none fixed inset-0 z-0 overflow-hidden">
            <svg className="absolute top-0 left-0 w-full h-full opacity-55" viewBox="0 0 1440 900" preserveAspectRatio="none">
              <path d="M-100,220 C320,420 580,40 1540,280 L1540,900 L-100,900 Z" fill="url(#wave1)" />
              <path d="M-100,520 C420,280 960,640 1540,380 L1540,900 L-100,900 Z" fill="url(#wave2)" />
              <defs>
                <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stopColor="#bae6fd" stopOpacity="0.6" />
                  <stop offset="100%" stopColor="#e0f2fe" stopOpacity="0.2" />
                </linearGradient>
                <linearGradient id="wave2" x1="1" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#6ee7b7" stopOpacity="0.35" />
                  <stop offset="50%" stopColor="#93c5fd" stopOpacity="0.35" />
                  <stop offset="100%" stopColor="#ffffff" stopOpacity="0.8" />
                </linearGradient>
              </defs>
            </svg>
            <div className="absolute bottom-0 left-0 right-0 h-28 bg-gradient-to-t from-[#bae6fd]/70 to-transparent flex items-end justify-around px-6 opacity-45">
              {[40, 68, 52, 85, 45, 60, 92, 55, 74, 50, 80, 62, 48, 70, 58, 82].map((h, i) => (
                <div key={i} style={{ height: `${h}%` }} className="w-8 md:w-16 bg-[#6495ed]/40 rounded-t-sm" />
              ))}
            </div>
          </div>

          {/* 상단 헤더 */}
          <header className="relative z-20 w-full bg-white/90 backdrop-blur-md border-b border-blue-100 px-5 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-2 shrink-0">
            <div className="flex items-center gap-4 lg:gap-7">
              <div onClick={startNewChat} className="flex items-center gap-2.5 cursor-pointer">
                <PangyoLogo size="small" />
                <span className="font-extrabold text-[#113264] text-lg lg:text-xl tracking-tight">판교 IT 활동 지원단</span>
              </div>

              <div className="hidden md:block h-5 w-px bg-slate-300" />

              <nav className="flex items-center gap-3 lg:gap-5 text-sm font-semibold text-slate-600">
                <button
                  onClick={() => setActiveTab("ai")}
                  className={`flex items-center gap-1.5 py-1 border-b-2 transition-all ${
                    activeTab === "ai" ? "text-blue-600 border-blue-600 font-bold" : "border-transparent hover:text-blue-600"
                  }`}
                >
                  <Icon name="home" className="w-4 h-4" /> AI 도우미
                </button>
                <span className="text-slate-300">|</span>
                <button
                  onClick={() => setActiveTab("docs")}
                  className={`flex items-center gap-1.5 py-1 border-b-2 transition-all ${
                    activeTab === "docs" ? "text-blue-600 border-blue-600 font-bold" : "border-transparent hover:text-blue-600"
                  }`}
                >
                  <Icon name="doc" className="w-4 h-4" /> 활동 자료
                </button>
                <span className="text-slate-300">|</span>
                <button
                  onClick={() => setActiveTab("notice")}
                  className={`flex items-center gap-1.5 py-1 border-b-2 transition-all ${
                    activeTab === "notice" ? "text-blue-600 border-blue-600 font-bold" : "border-transparent hover:text-blue-600"
                  }`}
                >
                  <Icon name="notice" className="w-4 h-4" /> 공지사항
                </button>
              </nav>
            </div>

            {/* 우측 컨트롤 바 */}
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={handleStartLiveClick}
                className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-sm transition-all"
              >
                <Icon name="wave" className="w-4 h-4" />
                <span>제미나이 라이브</span>
              </button>

              <select
                value={selectedModel}
                onChange={(e) => setSelectedModel(e.target.value)}
                className="text-xs bg-slate-100 hover:bg-slate-200/70 border border-slate-200 rounded-xl px-2.5 py-2 font-semibold text-slate-700 outline-none cursor-pointer max-w-[180px]"
              >
                {availableModels.map(m => (
                  <option key={m.id} value={m.id}>{m.label}</option>
                ))}
              </select>

              <select
                value={selectedVoice}
                onChange={(e) => {
                  setSelectedVoice(e.target.value);
                  localStorage.setItem("PANGYO_VOICE", e.target.value);
                }}
                className="text-xs bg-blue-50/90 hover:bg-blue-100/80 border border-blue-200 rounded-xl px-2.5 py-2 font-bold text-blue-800 outline-none cursor-pointer max-w-[175px]"
              >
                {GEMINI_VOICES.map(v => (
                  <option key={v.id} value={v.id}>{v.label}</option>
                ))}
              </select>

              <button
                onClick={() => setShowHistory(true)}
                className="p-2 text-slate-600 hover:bg-slate-100 rounded-xl"
                title="지난 대화 불러오기"
              >
                <Icon name="history" className="w-5 h-5" />
              </button>

              <button
                onClick={() => setShowSettings(true)}
                className={`px-3 py-2 rounded-xl flex items-center gap-1 text-xs font-bold border ${
                  apiKey
                    ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                    : "bg-amber-50 text-amber-700 border-amber-300 animate-pulse"
                }`}
              >
                <Icon name="settings" className="w-4 h-4" />
                <span>{apiKey ? "API 연결됨" : "API 키 입력"}</span>
              </button>
            </div>
          </header>

          {/* 본문 영역 */}
          <main className="relative z-10 flex-1 flex flex-col items-center justify-center w-full px-4 md:px-10 py-4 overflow-hidden">
            {activeTab !== "ai" ? (
              <div className="w-full h-full max-w-[1400px] bg-white/95 backdrop-blur rounded-3xl shadow-xl border border-blue-100 p-8 overflow-y-auto">
                <div className="flex justify-between items-center mb-4 pb-3 border-b">
                  <h2 className="text-xl font-extrabold text-[#113264]">
                    {activeTab === "docs" && "📁 판교 IT 활동 지원단 활동 자료실"}
                    {activeTab === "notice" && "📢 공지사항"}
                  </h2>
                  <button onClick={() => setActiveTab("ai")} className="text-sm font-bold text-blue-600 hover:underline">
                    ← AI 도우미로 돌아가기
                  </button>
                </div>
                {activeTab === "docs" && (
                  <ul className="space-y-3 text-sm text-slate-700">
                    <li className="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                      <span>1. 경로당 스마트 기기 교육 표준 교안 (태블릿·키오스크 기초)</span>
                      <button onClick={() => handleSend("경로당 어르신 대상 태블릿 및 키오스크 기초 교육 1시간 교안을 작성해줘.")} className="text-xs bg-blue-600 text-white px-3.5 py-2 rounded-xl font-bold">AI로 초안 열기</button>
                    </li>
                    <li className="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                      <span>2. IT 활동 지원단 일일 활동 일지 및 결과 보고서 양식</span>
                      <button onClick={() => handleSend("IT 활동 지원단 방문 교육 일일 활동 일지 양식을 표 형태로 만들어줘.")} className="text-xs bg-blue-600 text-white px-3.5 py-2 rounded-xl font-bold">AI로 초안 열기</button>
                    </li>
                  </ul>
                )}
                {activeTab === "notice" && (

              </div>
            </div>
          )}

          {/* 지난 대화 기록 서랍 */}
          {showHistory && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-white w-80 h-full p-5 shadow-2xl flex flex-col">
                <div className="flex justify-between items-center pb-4 border-b">
                  <h3 className="font-extrabold text-slate-800">지난 대화 세션</h3>
                  <button onClick={() => setShowHistory(false)} className="text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto py-3 space-y-2 custom-scrollbar">
                  {sessions.length === 0 ? (
                    <div className="text-center text-xs text-slate-400 mt-10">저장된 대화가 없습니다.</div>
                  ) : (
                    sessions.map(s => (
                      <div
                        key={s.id}
                        onClick={() => {
                          setCurrentSessionId(s.id);
                          setMessages(s.messages);
                          setActiveTab("ai");
                          setShowHistory(false);
                        }}
                        className="p-3 rounded-xl border border-slate-100 hover:bg-blue-50 cursor-pointer"
                      >
                        <div className="font-bold text-xs text-slate-700 truncate">{s.title}</div>
                        <div className="text-[11px] text-slate-400 mt-1">{s.date}</div>
                      </div>
                    ))
                  )}
                </div>
                <button
                  onClick={() => {
                    localStorage.removeItem("PANGYO_SESSIONS");
                    setSessions([]);
                  }}
                  className="text-xs text-red-500 hover:underline py-2 font-semibold"
                >
                  기록 전체 비우기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
